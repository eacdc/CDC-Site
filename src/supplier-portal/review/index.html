<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Quote Mapping Review</title>
<script>
  // Before first paint, so a dark choice never flashes light.
  try { const t = localStorage.getItem('spTheme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage blocked */ }
</script>
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --raised: #f8f9fb; --ink: #18202c; --muted: #5f6a7b; --line: #e1e5ec;
    --accent: #2457c5; --accent-ink: #ffffff; --accent-soft: #e8effc;
    --ok: #1d7a4b; --ok-soft: #e4f4ec; --warn: #95600a; --warn-soft: #fdf3e1; --bad: #b3261e; --bad-soft: #fbe9e7;
    --chip: #eef1f6; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 10px; --header: 56px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1319; --panel: #171c24; --raised: #1d232d; --ink: #e7eaf0; --muted: #9ba5b6; --line: #2a323e;
    --accent: #7ea4ff; --accent-ink: #0d1422; --accent-soft: #1d2a45;
    --ok: #5fd197; --ok-soft: #15301f; --warn: #f1b75e; --warn-soft: #34270f; --bad: #ff8d84; --bad-soft: #3a1714;
    --chip: #232a35; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1319; --panel: #171c24; --raised: #1d232d; --ink: #e7eaf0; --muted: #9ba5b6; --line: #2a323e;
      --accent: #7ea4ff; --accent-ink: #0d1422; --accent-soft: #1d2a45;
      --ok: #5fd197; --ok-soft: #15301f; --warn: #f1b75e; --warn-soft: #34270f; --bad: #ff8d84; --bad-soft: #3a1714;
      --chip: #232a35; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  a { color: var(--accent); }
  .muted, small { color: var(--muted); }
  .err { color: var(--bad); }
  [hidden] { display: none !important; }

  /* Controls */
  button, select, input, textarea { font: inherit; color: inherit; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 12px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
  button:hover:not(:disabled) { background: var(--chip); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .quote:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
  button.ok { background: var(--ok); border-color: var(--ok); color: var(--panel); }
  button.ok:hover:not(:disabled) { background: var(--ok); filter: brightness(1.08); }
  button.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  button.bad:hover:not(:disabled) { background: var(--bad-soft); }
  button.ghost { border-color: transparent; background: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; min-height: 36px; min-width: 0; }
  textarea { width: 100%; resize: vertical; min-height: 72px; }
  label { display: inline-flex; align-items: center; gap: 6px; }
  input[type=checkbox] { min-height: 0; width: 16px; height: 16px; accent-color: var(--accent); }

  /* Header */
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; min-height: var(--header);
    padding: 8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }
  .brand h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-controls { display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; padding: 3px; background: var(--chip); border-radius: 9px; gap: 2px; }
  .seg button { min-height: 28px; padding: 3px 10px; border: 0; background: transparent; border-radius: 7px; color: var(--muted); }
  .seg button:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .who { display: flex; align-items: center; gap: 4px; color: var(--muted); max-width: 300px; }
  .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { width: 36px; padding: 0; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Sign in */
  #login { max-width: 380px; margin: 9vh auto; padding: 24px; display: grid; gap: 12px; }
  #login h2 { margin: 0; font-size: 18px; }
  #login input, #login button { width: 100%; min-height: 42px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  /* Layout: two panes on a desktop, one at a time on a phone */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  main { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; align-items: start; }
  .list-pane { position: sticky; top: calc(var(--header) + 16px); height: calc(100vh - var(--header) - 32px); display: flex; flex-direction: column; overflow: hidden; }
  .list-head { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .list-head .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .list-head strong { font-size: 15px; }
  .list-head input[type=search] { width: 100%; }
  #quotes { overflow-y: auto; padding: 8px; display: grid; gap: 6px; align-content: start; flex: 1; }
  .detail-pane { overflow: hidden; }
  .back { display: none; }

  /* Quote list */
  .quote { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .quote:hover { background: var(--raised); }
  .quote.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .quote .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote .file { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quote .foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .bar { height: 4px; border-radius: 4px; background: var(--chip); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .chip.APPROVED { color: var(--ok); background: var(--ok-soft); }
  .chip.REJECTED { color: var(--bad); background: var(--bad-soft); }
  .chip.UNAPPROVED { color: var(--warn); background: var(--warn-soft); }

  /* Quote detail */
  .detail-head { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .title-row h2 { margin: 0; font-size: 18px; margin-right: auto; }
  .title-row a { text-decoration: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .question { border-left: 3px solid var(--warn); background: var(--warn-soft); border-radius: 0 8px 8px 0; padding: 8px 10px; margin: 0; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* One quote line: four columns on a wide screen, two on a medium one, stacked on a phone */
  .line, .line-head { display: grid; grid-template-columns: minmax(180px, 1.2fr) 130px minmax(240px, 2fr) 160px; gap: 16px; padding: 14px 16px; }
  .line { border-bottom: 1px solid var(--line); }
  .line:last-of-type { border-bottom: 0; }
  .line.decided { background: var(--raised); }
  .line .no { display: inline-block; min-width: 22px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .line .lbl { display: none; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
  .line .rate { font-variant-numeric: tabular-nums; font-weight: 600; }
  .line-head { padding-top: 8px; padding-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--raised); }
  .item .method { font-size: 12px; color: var(--muted); }
  details { margin-top: 6px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; width: fit-content; }
  details .why { margin-top: 6px; display: grid; gap: 4px; padding: 10px; background: var(--raised); border-radius: 8px; font-size: 13px; }
  .line.decided details .why { background: var(--panel); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .status small { display: block; }

  .picker { margin-top: 10px; display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .picker input { width: 100%; }
  .picker .results { display: grid; gap: 2px; max-height: 280px; overflow-y: auto; }
  .picker .results button { justify-content: flex-start; text-align: left; white-space: normal; border: 0; font-weight: 400; min-height: 38px; }
  .band { margin-top: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: grid; gap: 10px; }
  .band .field { display: grid; gap: 4px; }
  .band .field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .band .gsm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .band input[type=number] { width: 84px; }
  .band select { width: 100%; }
  .band .mills { display: flex; flex-wrap: wrap; gap: 6px 14px; max-height: 140px; overflow-y: auto; padding: 2px; }
  .band .preview { padding: 8px 10px; background: var(--raised); border-radius: 8px; font-size: 13px; }

  /* Dialog and toast */
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
  dialog::backdrop { background: rgba(10, 14, 20, .5); }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h3 { margin: 0; font-size: 16px; }
  dialog p { margin: 0; }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
    padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); max-width: calc(100vw - 32px); }
  #toast.err { background: var(--bad); color: #fff; }

  .skeleton { height: 64px; border-radius: 8px; background: linear-gradient(90deg, var(--chip), var(--raised), var(--chip)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

  @media (max-width: 1099px) {
    .line-head { display: none; }
    .line { grid-template-columns: 1fr auto; gap: 10px 16px; }
    .line .cell-status { grid-row: 1; grid-column: 2; text-align: right; }
    .line .cell-rate { grid-column: 1 / -1; }
    .line .cell-item { grid-column: 1 / -1; }
    .line .lbl { display: block; }
  }

  /* Phone: one pane at a time, thumb-sized buttons */
  @media (max-width: 760px) {
    :root { --header: 52px; }
    header { flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
    .brand h1 { font-size: 15px; }
    .header-controls { order: 3; width: 100%; justify-content: space-between; }
    .who span { max-width: 150px; font-size: 12px; }
    main { grid-template-columns: 1fr; padding: 10px; gap: 10px; }
    .list-pane { position: static; height: auto; overflow: visible; }
    #quotes { overflow: visible; }
    body.viewing .list-pane { display: none; }
    body:not(.viewing) .detail-pane { display: none; }
    .back { display: inline-flex; }
    .detail-head { padding: 12px; }
    .line { padding: 12px; }
    .actions button { flex: 1 1 calc(50% - 6px); min-height: 42px; }
    .detail-head .seg { width: 100%; }
    .detail-head .seg button { flex: 1; }
    button { min-height: 40px; }
    .seg button { min-height: 32px; }
    input, select { min-height: 42px; font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">CDC</div><h1>Quote mapping review</h1></div>
  <div class="header-controls">
    <div class="seg" role="group" aria-label="Site">
      <button type="button" data-site="KOL" aria-pressed="true">Kolkata</button>
      <button type="button" data-site="AHM" aria-pressed="false">Ahmedabad</button>
    </div>
    <div class="who" id="whoBox" hidden><span id="who"></span><button id="logout" class="ghost">Sign out</button></div>
  </div>
  <button id="theme" class="icon-btn ghost" type="button"></button>
</header>

<section id="login" class="panel" hidden>
  <h2>Sign in</h2>
  <span class="muted">Review the Indus items proposed for supplier quotes.</span>
  <form id="pwForm" style="display:grid;gap:10px">
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary">Sign in</button>
  </form>
  <form id="erpForm" style="display:grid;gap:10px" hidden>
    <div class="divider">or with your ERP user name</div>
    <input id="erpUser" placeholder="ERP user name" autocomplete="username">
    <button>Sign in with ERP name</button>
  </form>
  <span id="loginErr" class="err" role="alert"></span>
</section>

<main id="app" hidden>
  <section class="panel list-pane">
    <div class="list-head">
      <div class="row"><strong>Quotes</strong><label class="muted"><input type="checkbox" id="showAll"> Show decided</label></div>
      <input type="search" id="search" placeholder="Search supplier or file" aria-label="Search quotes">
    </div>
    <div id="quotes"></div>
  </section>
  <section class="panel detail-pane" id="detail"></section>
</main>

<dialog id="dlg">
  <form method="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText" class="muted"></p>
    <label id="dlgNoteWrap" style="display:grid;gap:4px"><span class="muted">Note (optional)</span><textarea id="dlgNote"></textarea></label>
    <div class="buttons"><button value="cancel" formnovalidate>Cancel</button><button value="ok" id="dlgOk" class="primary">Confirm</button></div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>

<script>
const API = '/api/supplier-portal';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Same wording as paper/band.js on the server. */
const bandLabel = (b) => {
  const groups = b.groupIds?.length ? b.groupIds : [2, 14];
  const form = groups.length === 1 ? (groups[0] === 14 ? 'sheet' : 'reel') : 'sheet or reel';
  const gsm = b.gsmTo && b.gsmTo !== b.gsmFrom ? `${b.gsmFrom}–${b.gsmTo}` : `${b.gsmFrom}`;
  return [b.quality, b.mills?.length ? b.mills.join(' or ') : 'any mill', form, `${gsm} GSM`].join(', ');
};
const money = (v) => (v == null || v === '' ? '—' : `₹${Number(v).toLocaleString('en-IN', { maximumFractionDigits: 2 })}`);
const when = (d) => new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const phone = () => matchMedia('(max-width: 760px)').matches;
const NO_QUOTE = '<div class="empty">Choose a quote to review its lines.</div>';
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { /* private window */ } },
};
let user = null;
let current = null;
let site = 'KOL';
let quotes = [];
let lineFilter = 'WAITING';

/* Theme: follows the device until the toggle is used, then keeps the choice. */
const ICONS = {
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
const darkNow = () => document.documentElement.dataset.theme === 'dark'
  || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
function showThemeButton() {
  const next = darkNow() ? 'light' : 'dark';
  $('theme').innerHTML = ICONS[next];
  $('theme').title = `Switch to ${next} mode`;
  $('theme').setAttribute('aria-label', `Switch to ${next} mode`);
}
$('theme').onclick = () => {
  const next = darkNow() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('spTheme', next); } catch { /* storage blocked */ }
  showThemeButton();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', showThemeButton);
showThemeButton();

let toastTimer = null;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg; t.className = isErr ? 'err' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, isErr ? 6000 : 3000);
}

/** In-page confirm: resolves to the note ('' when none) or null when cancelled. */
function ask({ title, text, note = false, ok = 'Confirm', danger = false }) {
  const d = $('dlg');
  $('dlgTitle').textContent = title; $('dlgText').textContent = text;
  $('dlgNoteWrap').hidden = !note; $('dlgNote').value = '';
  $('dlgOk').textContent = ok; $('dlgOk').className = danger ? 'bad' : 'primary';
  d.returnValue = '';
  d.showModal();
  (note ? $('dlgNote') : $('dlgOk')).focus();
  return new Promise((resolve) => {
    d.addEventListener('close', () => resolve(d.returnValue === 'ok' ? $('dlgNote').value.trim() : null), { once: true });
  });
}

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'X-SP-Site': site,
      ...(store.get('spToken') ? { Authorization: `Bearer ${store.get('spToken')}` } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signedOut(); throw new Error('Please sign in again.'); }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function signedOut() {
  store.set('spToken', null); user = null;
  $('app').hidden = true; $('login').hidden = false; $('whoBox').hidden = true; $('who').textContent = '';
}

async function signedIn(result) {
  store.set('spToken', result.token);
  user = result.user;
  $('login').hidden = true; $('app').hidden = false; $('whoBox').hidden = false;
  const viewOnly = !(user.roles?.includes('APPROVER') || user.roles?.includes('ADMIN'));
  $('who').textContent = `${user.displayName || user.email || ''}${viewOnly ? ' · view only' : ''}`;
  $('who').title = viewOnly ? 'Approving needs the APPROVER role' : '';
  closeQuote();
  loadQuotes();
}

async function login(path, body) {
  $('loginErr').textContent = '';
  try { await signedIn(await api(path, { method: 'POST', body: { ...body, site } })); }
  catch (e) { $('loginErr').textContent = e.message; }
}

function setSite(s) {
  site = s;
  document.querySelectorAll('[data-site]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.site === s)));
}

$('pwForm').onsubmit = (e) => { e.preventDefault(); login('/auth/login', { email: $('email').value, password: $('password').value }); };
$('erpForm').onsubmit = (e) => { e.preventDefault(); login('/auth/erp-login', { username: $('erpUser').value }); };
$('logout').onclick = async () => { try { await api('/auth/logout', { method: 'POST' }); } catch { /* already out */ } signedOut(); };
document.querySelectorAll('[data-site]').forEach((b) => {
  b.onclick = () => {
    if (b.dataset.site === site) return;
    setSite(b.dataset.site); store.set('spSite', site);
    if (user) { closeQuote(); loadQuotes(); }
  };
});
$('showAll').onchange = () => user && loadQuotes();
$('search').oninput = () => renderQuotes();

async function loadQuotes() {
  $('quotes').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  try {
    ({ quotes } = await api(`/proposals/quotes?site=${site}${$('showAll').checked ? '&all=1' : ''}`));
    renderQuotes();
  } catch (e) { $('quotes').innerHTML = `<p class="err" style="padding:8px">${esc(e.message)}</p>`; }
}

function renderQuotes() {
  const q = $('search').value.trim().toLowerCase();
  const shown = quotes.filter((x) => !q || `${x.supplier?.name || ''} ${x.fileName || ''}`.toLowerCase().includes(q));
  if (!quotes.length) { $('quotes').innerHTML = '<div class="empty">Nothing waiting for review.</div>'; return; }
  if (!shown.length) { $('quotes').innerHTML = '<div class="empty">No quote matches the search.</div>'; return; }
  $('quotes').innerHTML = shown.map((x) => {
    const done = x.total ? Math.round(((x.total - x.unapproved) / x.total) * 100) : 0;
    return `<div class="quote${current === x._id ? ' active' : ''}" data-id="${esc(x._id)}" tabindex="0" role="button">
      <div class="name">${esc(x.supplier?.name || 'Unknown supplier')}</div>
      <div class="file">${esc(x.fileName)} · ${when(x.createdAt)}</div>
      <div class="bar" title="${done}% decided"><i style="width:${done}%"></i></div>
      <div class="foot">
        ${x.unapproved ? `<span class="chip UNAPPROVED">${x.unapproved} waiting</span>` : '<span class="chip APPROVED">All decided</span>'}
        <span class="muted">of ${x.total} lines</span>
        ${x.questions?.length ? `<span class="chip">${x.questions.length} question${x.questions.length > 1 ? 's' : ''}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  document.querySelectorAll('.quote').forEach((el) => {
    el.onclick = () => openQuote(el.dataset.id);
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openQuote(el.dataset.id); } };
  });
}

function closeQuote() {
  current = null;
  document.body.classList.remove('viewing');
  $('detail').innerHTML = NO_QUOTE;
  document.querySelectorAll('.quote').forEach((el) => el.classList.remove('active'));
}

async function openQuote(id, { keepScroll = false } = {}) {
  const y = window.scrollY;
  if (current !== id) {
    lineFilter = 'WAITING';
    $('detail').innerHTML = '<div style="padding:16px;display:grid;gap:10px"><div class="skeleton"></div><div class="skeleton"></div></div>';
    if (phone()) window.scrollTo(0, 0);
  }
  current = id;
  document.body.classList.add('viewing');
  document.querySelectorAll('.quote').forEach((el) => el.classList.toggle('active', el.dataset.id === id));
  try {
    renderQuote(await api(`/proposals/quotes/${id}`));
    if (keepScroll) window.scrollTo(0, y);
  } catch (e) { $('detail').innerHTML = `<p class="err" style="padding:16px">${esc(e.message)}</p>`; }
}

function renderQuote({ quote, proposals }) {
  const canDecide = user?.roles?.includes('APPROVER') || user?.roles?.includes('ADMIN');
  const waiting = proposals.filter((p) => p.status === 'UNAPPROVED').length;
  if (!waiting && lineFilter === 'WAITING') lineFilter = 'ALL';
  const counts = { WAITING: waiting, ALL: proposals.length, DECIDED: proposals.length - waiting };
  const meta = [
    quote.documentDate && `Dated ${quote.documentDate}`, quote.effectiveFrom && `Effective ${quote.effectiveFrom}`,
    quote.materialClass, quote.rulesVersion && `Rules ${quote.rulesVersion}`,
  ].filter(Boolean);
  $('detail').innerHTML = `
    <div class="detail-head">
      <div class="back"><button class="ghost" id="back" style="padding-left:0">← All quotes</button></div>
      <div class="title-row">
        <h2>${esc(quote.supplier?.name || 'Unknown supplier')}</h2>
        ${quote.fileUrl ? `<a href="${esc(quote.fileUrl)}" target="_blank" rel="noopener"><button tabindex="-1">Open quote file ↗</button></a>` : ''}
      </div>
      <div class="meta">
        ${quote.supplier?.gstin ? `<span class="chip">GSTIN ${esc(quote.supplier.gstin)}</span>` : ''}
        ${meta.map((m) => `<span class="chip">${esc(m)}</span>`).join('')}
      </div>
      <div class="muted" style="font-size:12px;word-break:break-all">${esc(quote.fileName)}</div>
      ${(quote.questions || []).map((q) => `<p class="question"><strong>${esc(q.kind)}</strong> ${esc(q.text)}${q.lineNos?.length ? ` <small>(lines ${q.lineNos.join(', ')})</small>` : ''}</p>`).join('')}
      <div><div class="seg" role="group" aria-label="Show lines">
        ${['WAITING', 'ALL', 'DECIDED'].map((f) => `<button type="button" data-filter="${f}" aria-pressed="${lineFilter === f}">${{ WAITING: 'Waiting', ALL: 'All', DECIDED: 'Decided' }[f]}&nbsp;<span class="muted">${counts[f]}</span></button>`).join('')}
      </div></div>
    </div>
    <div class="line-head"><div>Quote line</div><div>Rate</div><div>Proposed Indus item</div><div>Status</div></div>
    ${proposals.map((p) => row(p, canDecide)).join('')}
    <div class="empty" id="noLines" hidden></div>`;
  $('back').onclick = closeQuote;
  document.querySelectorAll('[data-filter]').forEach((b) => { b.onclick = () => { lineFilter = b.dataset.filter; applyFilter(); }; });
  document.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => act(b.dataset.id, b.dataset.act, b); });
  document.querySelectorAll('[data-change]').forEach((b) => { b.onclick = () => openPicker(b.dataset.change); });
  document.querySelectorAll('[data-band]').forEach((b) => { b.onclick = () => openBand(b.dataset.band); });
  document.querySelectorAll('[data-compare]').forEach((b) => { b.onclick = () => compare(b.dataset.compare, b); });
  applyFilter();
}

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.line').forEach((el) => {
    const waiting = el.dataset.status === 'UNAPPROVED';
    const show = lineFilter === 'ALL' || (lineFilter === 'WAITING') === waiting;
    el.hidden = !show; shown += show;
  });
  document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filter === lineFilter)));
  $('noLines').hidden = shown > 0;
  $('noLines').textContent = lineFilter === 'WAITING' ? 'Every line of this quote is decided.' : 'No decided lines yet.';
}

function row(p, canDecide) {
  const l = p.line || {}; const r = p.rate || {}; const pr = p.proposal || {};
  const spec = [l.brand, l.grade, l.gsmFrom ? `${l.gsmFrom}${l.gsmTo && l.gsmTo !== l.gsmFrom ? `–${l.gsmTo}` : ''} GSM` : null, l.sizeText, l.packSize].filter(Boolean).join(' · ');
  const decided = p.status !== 'UNAPPROVED';
  const paper = Boolean(l.gsmFrom || l.gsmTo || pr.band);
  const band = (b) => `<strong>Band:</strong> ${esc(bandLabel(b))}${b.itemCount ? ` <small>(${esc(b.itemCount)} Indus items)</small>` : ''}`;
  let item;
  if (decided && p.decision?.band?.quality) item = band(p.decision.band);
  else if (decided && p.decision?.itemId) item = `<strong>${esc(p.decision.itemId)}</strong> ${esc(p.decision.itemName || '')}`;
  else if (pr.itemId) item = `<strong>${esc(pr.itemId)}</strong> ${esc(pr.itemName || '')}`;
  else if (pr.band?.quality) item = band(pr.band);
  else item = '<span class="muted">No item proposed</span>';
  const statusText = { UNAPPROVED: 'Waiting', APPROVED: 'Approved', REJECTED: 'Rejected' }[p.status] || p.status;
  return `<div class="line${decided ? ' decided' : ''}" data-status="${esc(p.status)}">
    <div class="cell-line">
      <span class="no">${esc(p.lineNo ?? '')}</span> <strong>${esc(l.productName)}</strong>${l.productCode ? ` <small>${esc(l.productCode)}</small>` : ''}
      ${spec ? `<div><small>${esc(spec)}</small></div>` : ''}
    </div>
    <div class="cell-rate"><div class="lbl">Rate</div>
      <span class="rate">${money(r.rate)}</span>${r.uom ? `<small> / ${esc(r.uom)}</small>` : ''}
      ${r.ratePerBaseUom != null && r.ratePerBaseUom !== r.rate ? `<div><small>= ${money(r.ratePerBaseUom)} per base unit</small></div>` : ''}
      ${r.flags?.length ? `<div><small>${esc(r.flags.join(', '))}</small></div>` : ''}
    </div>
    <div class="cell-item item"><div class="lbl">Proposed Indus item</div>
      <div>${item}</div>
      <div class="method">${esc(pr.method || '')}${pr.confidence != null ? ` · ${Math.round(pr.confidence * 100)}% sure` : ''}</div>
      ${p.refreshes ? `<div><small title="The rules changed after this line was first read, and found this">Refreshed ${when(p.createdAt)} by rules ${esc(p.rulesVersion)}</small></div>` : ''}
      ${pr.question ? `<p class="question" style="margin-top:6px">${esc(pr.question)}</p>` : ''}
      ${pr.rationale || pr.evidence?.length || pr.alternatives?.length ? `<details><summary>Why this item</summary><div class="why">
        ${pr.rationale ? `<div>${esc(pr.rationale)}</div>` : ''}
        ${(pr.evidence || []).map((e) => `<div><span class="chip">${esc(e.kind)}</span> ${esc(e.text)}</div>`).join('')}
        ${pr.alternatives?.length ? `<div class="muted" style="margin-top:4px">Other candidates</div>${pr.alternatives.map((a) => `<div>${esc(a.itemId)} ${esc(a.itemName || '')} <small>last paid ${money(a.lastPaidRate)}</small></div>`).join('')}` : ''}
      </div></details>` : ''}
      ${!decided && canDecide ? `<div class="actions">
        <button class="ok" data-act="APPROVE" data-id="${esc(p._id)}" ${pr.itemId || pr.band?.quality ? '' : `disabled title="Nothing proposed: use ${paper ? 'Approve as paper band or ' : ''}Change item"`}>✓ Approve</button>
        ${paper ? `<button data-band="${esc(p._id)}" title="Approve for every Indus item of one quality in a GSM range">Approve as paper band</button>` : ''}
        <button data-change="${esc(p._id)}">Change item</button>
        <button class="bad" data-act="REJECT" data-id="${esc(p._id)}">Reject</button>
      </div><div id="pick-${esc(p._id)}"></div>` : ''}
    </div>
    <div class="cell-status status">
      <span class="chip ${esc(p.status)}">${esc(statusText)}</span>
      ${decided ? `<small style="margin-top:4px">${esc(p.decision?.action || '')} by ${esc(p.decision?.by || '')}</small><small>${p.decision?.at ? when(p.decision.at) : ''}</small>${p.decision?.note ? `<small style="color:var(--ink)">“${esc(p.decision.note)}”</small>` : ''}` : ''}
      ${p.status === 'APPROVED' && p.decision?.itemId ? `<button data-compare="${esc(p.decision.itemId)}" style="margin-top:6px">Compare suppliers</button><div id="cmp-${esc(p.decision.itemId)}" style="font-size:13px"></div>` : ''}
    </div>
  </div>`;
}

async function act(id, action, button, itemId = null, band = null, itemName = '') {
  const what = {
    APPROVE: { title: 'Approve this line?', ok: 'Approve' },
    REJECT: { title: 'Reject this line?', ok: 'Reject', danger: true, note: true },
    CHANGE: { title: `Map to item ${itemId}?`, ok: 'Map to this item', note: true, text: itemName },
    BAND: { title: 'Approve as a paper band?', ok: 'Approve band', text: band && bandLabel(band) },
  }[action];
  const note = await ask({ ...what, text: [what.text, 'A decision cannot be changed afterwards.'].filter(Boolean).join('. ') });
  if (note === null) return;
  if (button) button.disabled = true;
  try {
    await api(`/proposals/${id}/decision`, { method: 'POST', body: { action, itemId, band, note: note || null } });
    toast({ APPROVE: 'Approved', REJECT: 'Rejected', CHANGE: `Mapped to ${itemId}`, BAND: 'Band approved' }[action]);
    await openQuote(current, { keepScroll: true }); loadQuotes();
  } catch (e) { toast(e.message, true); if (button) button.disabled = false; }
}

function openPicker(id) {
  const box = $(`pick-${id}`);
  box.innerHTML = '<div class="picker"><input type="search" placeholder="Search Indus items by name, code or ID"><div class="results muted">Type at least 2 characters.</div><div><button data-cancel class="ghost">Cancel</button></div></div>';
  const input = box.querySelector('input'); const out = box.querySelector('.results');
  box.querySelector('[data-cancel]').onclick = () => { box.innerHTML = ''; };
  let timer = null;
  input.oninput = () => {
    clearTimeout(timer);
    if (input.value.trim().length < 2) { out.textContent = 'Type at least 2 characters.'; return; }
    out.textContent = 'Searching…';
    timer = setTimeout(async () => {
      try {
        const { results } = await api(`/items/search?q=${encodeURIComponent(input.value.trim())}&limit=15`);
        out.innerHTML = results.length ? results.map((it) => `<button class="ghost" data-item="${esc(it.ItemID ?? it.itemId)}" data-name="${esc(it.ItemName ?? it.itemName)}"><span><strong>${esc(it.ItemID ?? it.itemId)}</strong> ${esc(it.ItemName ?? it.itemName)} <small>${esc(it.StockUnit || '')}</small></span></button>`).join('') : 'No items found.';
        out.querySelectorAll('[data-item]').forEach((d) => { d.onclick = () => act(id, 'CHANGE', null, Number(d.dataset.item), null, d.dataset.name); });
      } catch (e) { out.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
    }, 250);
  };
  input.focus();
}

/**
 * Approve a paper line as a band: one Indus quality, the mills it covers (none
 * ticked means any), sheet and/or reel, over a GSM range. The count and a few
 * item names update as the choice changes, so the reviewer sees what the
 * line's rate will price before approving it.
 */
async function openBand(id, range = {}) {
  const box = $(`pick-${id}`);
  box.innerHTML = '<div class="band muted">Loading the Indus qualities in this GSM range…</div>';
  const gsmRow = (from, to, label) => `<div class="field"><span>GSM range</span><div class="gsm"><input type="number" inputmode="numeric" data-f="from" value="${esc(from ?? '')}"> to <input type="number" inputmode="numeric" data-f="to" value="${esc(to ?? '')}"> <button data-look>${label}</button></div></div>`;
  const lookAgain = () => { box.querySelector('[data-look]').onclick = () => openBand(id, { gsmFrom: box.querySelector('[data-f=from]').value, gsmTo: box.querySelector('[data-f=to]').value }); };
  let data;
  try {
    const q = range.gsmFrom ? `?gsmFrom=${encodeURIComponent(range.gsmFrom)}&gsmTo=${encodeURIComponent(range.gsmTo || range.gsmFrom)}` : '';
    data = await api(`/proposals/${id}/band-choices${q}`);
  } catch (e) {
    box.innerHTML = `<div class="band"><span class="err">${esc(e.message)}</span>${gsmRow(range.gsmFrom, range.gsmTo, 'Look')}</div>`;
    lookAgain();
    return;
  }
  if (!data.choices.length) {
    box.innerHTML = `<div class="band"><span class="muted">No paper or board item in Indus is ${esc(data.gsmFrom)}–${esc(data.gsmTo)} GSM.</span>${gsmRow(data.gsmFrom, data.gsmTo, 'Look again')}</div>`;
    lookAgain();
    return;
  }
  const opt = (c, i) => `<option value="${i}">${esc(c.quality)} — ${c.byGroup[14] || 0} sheet, ${c.byGroup[2] || 0} reel</option>`;
  box.innerHTML = `<div class="band">
    ${gsmRow(data.gsmFrom, data.gsmTo, 'Look again')}
    <div class="field"><span>Indus quality</span><select data-f="quality">${data.choices.map(opt).join('')}</select></div>
    <div class="field"><span>Form</span><div style="display:flex;gap:16px"><label><input type="checkbox" data-g="14"> Sheet</label><label><input type="checkbox" data-g="2"> Reel</label></div></div>
    <div class="field"><span>Mills (none ticked = any mill)</span><div class="mills" data-f="mills"></div></div>
    <div data-f="preview" class="preview muted"></div>
    <div class="actions" style="margin-top:0"><button class="ok" data-f="approve" disabled>✓ Approve this band</button><button data-f="cancel">Cancel</button></div>
  </div>`;
  lookAgain();
  const el = (f) => box.querySelector(`[data-f="${f}"]`);
  const choice = () => data.choices[Number(el('quality').value)];
  const band = () => ({
    quality: choice().quality,
    mills: [...box.querySelectorAll('[data-mill]:checked')].map((m) => m.dataset.mill),
    groupIds: [...box.querySelectorAll('[data-g]:checked')].map((g) => Number(g.dataset.g)),
    gsmFrom: Number(el('from').value), gsmTo: Number(el('to').value),
  });
  let seq = 0;
  const preview = async () => {
    const mine = ++seq;
    el('approve').disabled = true;
    const b = band();
    if (!b.groupIds.length) { el('preview').textContent = 'Tick sheet, reel or both.'; return; }
    el('preview').textContent = 'Counting…';
    try {
      const r = await api(`/proposals/${id}/band-preview`, { method: 'POST', body: { band: b } });
      if (mine !== seq) return;
      el('preview').innerHTML = r.itemCount
        ? `<strong style="color:var(--ink)">${r.itemCount} Indus items</strong> will take this line's rate, for example:<br>${r.sample.map((s) => `${esc(s.itemId)} ${esc(s.itemName)} <small>(${esc(s.mill || '—')})</small>`).join('<br>')}${r.itemCount > r.sample.length ? '<br>…' : ''}`
        : '<span class="err">No Indus item is inside this band.</span>';
      el('approve').disabled = !r.itemCount;
    } catch (e) { if (mine === seq) el('preview').innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  };
  const showQuality = () => {
    const c = choice();
    box.querySelectorAll('[data-g]').forEach((g) => { const n = c.byGroup[g.dataset.g] || 0; g.checked = n > 0; g.disabled = !n; });
    el('mills').innerHTML = c.mills.map((m) => `<label><input type="checkbox" data-mill="${esc(m.mill)}"> ${esc(m.mill)} <small>${m.items}</small></label>`).join('') || '<span class="muted">No mill recorded</span>';
    preview();
  };
  el('quality').onchange = showQuality;
  box.querySelectorAll('[data-g]').forEach((g) => { g.onchange = preview; });
  el('mills').onchange = preview;
  el('cancel').onclick = () => { box.innerHTML = ''; };
  el('approve').onclick = () => act(id, 'BAND', el('approve'), null, band());
  showQuality();
}

async function compare(itemId, button) {
  const box = $(`cmp-${itemId}`);
  button.disabled = true;
  try {
    const { offers } = await api(`/proposals/compare/${itemId}`);
    box.innerHTML = offers.length ? offers.map((o, i) => `<div>${i === 0 ? '<strong>Cheapest:</strong> ' : ''}${esc(o.supplier?.name || '')} ${money(o.rate?.ratePerBaseUom ?? o.rate?.rate)} <small>${new Date(o.createdAt).toLocaleDateString('en-IN')}</small></div>`).join('') : '<small>No other approved prices yet.</small>';
  } catch (e) { box.innerHTML = `<small class="err">${esc(e.message)}</small>`; }
  button.disabled = false;
}

(async function start() {
  const saved = store.get('spSite'); if (saved === 'KOL' || saved === 'AHM') setSite(saved);
  $('detail').innerHTML = NO_QUOTE;
  try { const m = await fetch(`${API}/auth/methods`).then((r) => r.json()); $('erpForm').hidden = !m.erp; } catch { /* password only */ }
  if (!store.get('spToken')) return signedOut();
  try { const me = await api('/auth/me'); await signedIn({ token: store.get('spToken'), user: me.user || me }); }
  catch { signedOut(); }
}());
</script>
</body>
